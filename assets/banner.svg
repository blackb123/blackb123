<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="blackb123 — fullstack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060A"/><stop offset="1" stop-color="#0B0E16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".22"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity=".28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6C7A90" stroke-opacity=".14" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/>
      <stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><rect width="1200" height="340" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#edge)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- scan line -->
  <g mask="url(#edge)">
    <rect x="0" width="1200" height="70" fill="url(#scan)">
      <animate attributeName="y" values="-70;340" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" width="1200" height="1" fill="#00E5FF" opacity=".7">
      <animate attributeName="y" values="0;340" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- orbit + mark -->
  <g transform="translate(600 112)">
    <circle r="86" fill="none" stroke="#00E5FF" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle r="62" fill="none" stroke="#8A8F98" stroke-opacity=".35" stroke-width="1"/>
      <circle cx="62" cy="0" r="3.5" fill="#00E5FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="-86" cy="0" r="2.2" fill="#E8ECF2" opacity=".8"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
    </g>
    <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#05060A" stroke="#00E5FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="11" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="32" font-weight="700" fill="#E8ECF2">b</text>
  </g>

  <!-- name -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <text x="600" y="238" font-size="40" font-weight="700" letter-spacing="10" fill="#E8ECF2" opacity="0">
      blackb123
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>
    <!-- rotating taglines -->
    <text x="600" y="282" font-size="15" letter-spacing="3" fill="#00E5FF" opacity="0">
      fullstack developer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.30;.36;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="282" font-size="15" letter-spacing="3" fill="#00E5FF" opacity="0">
      react · node · python
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.39;.63;.69;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="282" font-size="15" letter-spacing="3" fill="#00E5FF" opacity="0">
      automation &amp; ai tooling
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.72;.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- corner ticks -->
  <g stroke="#8A8F98" stroke-opacity=".5" stroke-width="1" fill="none">
    <path d="M24 44V24H44"/><path d="M1176 44V24H1156"/>
    <path d="M24 296V316H44"/><path d="M1176 296V316H1156"/>
  </g>
</svg>
