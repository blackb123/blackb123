<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="blackb123 logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="200" height="200" fill="#05060A"/>
  <g transform="translate(100 100)">
    <circle r="82" fill="none" stroke="#00E5FF" stroke-opacity=".2" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle r="60" fill="none" stroke="#8A8F98" stroke-opacity=".35"/>
      <circle cx="60" r="4" fill="#00E5FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </g>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#05060A" stroke="#00E5FF" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;.45;1" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <text y="12" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#E8ECF2">b</text>
  </g>
</svg>
