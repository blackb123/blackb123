<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="connect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="40" width="1200" height="1" fill="#8A8F98" fill-opacity=".35"/>
  <rect x="0" y="39" width="160" height="3" fill="url(#pulse)">
    <animate attributeName="x" values="-160;1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="8" cy="20" r="3" fill="#00E5FF">
    <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="25" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="2" fill="#8A8F98">connect</text>
</svg>
